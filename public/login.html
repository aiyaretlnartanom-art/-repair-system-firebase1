<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - Project Mahain</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0d0a12;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-card {
      background-color: #16121e;
      border: 1px solid #282035;
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .login-card h2 {
      color: #c084fc;
      text-align: center;
      margin-bottom: 24px;
      font-size: 1.8rem;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: #a78bfa;
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      background-color: #0f0c15;
      border: 1px solid #3b2d54;
      border-radius: 8px;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #a855f7;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #7e22ce, #a855f7);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 10px;
    }

    .btn-submit:hover {
      opacity: 0.9;
    }

    .error-msg {
      color: #f87171;
      font-size: 0.85rem;
      margin-top: 10px;
      text-align: center;
      display: none;
    }
  </style>

  <!-- Firebase v9+ Modular Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // 🔴 ใส่ Firebase Config ของคุณตรงนี้
     const firebaseConfig = {
    apiKey: "AIzaSyBL0tp785h5OSvDfMBNHGBIzf0YhwDAaDw",
  authDomain: "projectmahainwaiyaret.firebaseapp.com",
  projectId: "projectmahainwaiyaret",
  storageBucket: "projectmahainwaiyaret.firebasestorage.app",
  messagingSenderId: "967076267529",
  appId: "1:967076267529:web:b5f9bf8d7d812f31781ad8",
  measurementId: "G-Z229KKWLLF"
    };
    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // ตรวจสอบว่าถ้าเข้าสู่ระบบไว้อยู่แล้ว ให้เด้งไปหน้า index.html ทันที
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = "index.html";
      }
    });

    // การทำงานเมื่อกดปุ่ม เข้าสู่ระบบ
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('errorMsg');

      errorDiv.style.display = 'none';

      try {
        await signInWithEmailAndPassword(auth, email, password);
        // เมื่อ Login สำเร็จ จะวิ่งไปที่ index.html
        window.location.href = "index.html";
      } catch (error) {
        errorDiv.textContent = "อีเมลหรือรหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง";
        errorDiv.style.display = 'block';
      }
    });
  </script>
</head>
<body>

  <div class="login-card">
    <h2>เข้าสู่ระบบ</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">อีเมล (Email)</label>
        <input type="email" id="email" placeholder="example@email.com" required>
      </div>

      <div class="form-group">
        <label for="password">รหัสผ่าน (Password)</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit">เข้าสู่ระบบ</button>
      <div id="errorMsg" class="error-msg"></div>
    </form>
  </div>

</body>
</html>
